services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: navettexpress_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: navettexpress
      POSTGRES_USER: navettexpress_user
      POSTGRES_PASSWORD: navettexpress_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U navettexpress_user -d navettexpress"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - navettexpress_network

  # Passerelle WhatsApp (OpenWA) — canal de notifications, non-officiel, voir docs/16-risk-management.md du projet OpenWA
  openwa:
    image: ghcr.io/rmyndharis/openwa:latest
    container_name: navettexpress_openwa
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_TYPE=sqlite
      - DATABASE_SYNCHRONIZE=true
      - ENGINE_TYPE=whatsapp-web.js
      - API_MASTER_KEY=${OPENWA_API_MASTER_KEY:-}
      - AUTO_START_SESSIONS=true
      - SEND_PACING_ENABLED=true
    volumes:
      - openwa_data:/app/data
    ports:
      - "127.0.0.1:2785:2785"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:2785/api/health/ready', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - navettexpress_network

  # Application Next.js
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: navettexpress_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - navettexpress_network

volumes:
  postgres_data:
  openwa_data:

networks:
  navettexpress_network:
    driver: bridge