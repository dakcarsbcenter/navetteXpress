services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: navettexpress_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: navettexpress
      POSTGRES_USER: navettexpress_user
      POSTGRES_PASSWORD: navettexpress_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U navettexpress_user -d navettexpress"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - navettexpress_network

  # Application Next.js
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* : figées dans le bundle client au build, donc doivent
        # être passées ici (résolues depuis l'environnement shell au moment de
        # `docker compose build` — deploy.sh les exporte depuis .env.docker).
        NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME:-}
        NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: ${NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET:-}
    container_name: navettexpress_app
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - navettexpress_network

  # Reverse proxy HTTPS (Let's Encrypt automatique)
  caddy:
    image: caddy:2-alpine
    container_name: navettexpress_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - navettexpress_network

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  navettexpress_network:
    driver: bridge