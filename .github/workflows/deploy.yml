name: Déploiement production (VPS)

# Déclenchement manuel uniquement (bouton "Run workflow" dans l'onglet Actions
# de GitHub) — volontairement pas automatique à chaque push, pour garder une
# validation humaine avant toute mise en production.
# Voir docs/GUIDE_DEPLOIEMENT_PRODUCTION.md, chapitre 17.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branche à déployer"
        required: false
        default: "main"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Déployer via SSH sur le VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /opt/navettexpress
            ./scripts/deploy.sh "${{ github.event.inputs.branch }}"
